# config.example.yaml
server:
  port: 8080
  mode: debug  # debug, release, test

database:
  host: localhost
  port: 5432
  user: epay
  password: your_password_here
  dbname: epay
  sslmode: disable

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: your_jwt_secret_here_change_in_production
  expire_hour: 168  # 7 days

# 异步 Worker：固定并发执行通知/查单 IO，扫库仅作调度兜底
worker:
  notify_concurrency: 16
  notify_poll_interval_sec: 2
  query_concurrency: 16
  query_poll_interval_sec: 2

site:
  beian_icp: ""
  beian_gongan: ""
